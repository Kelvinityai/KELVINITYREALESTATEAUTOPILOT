<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Land for Sale in Abuja</title>
  <style>
    :root {
      --navy: #0a2f4c;
      --navy-2: #1b3d61;
      --sky: #cfe1ee;
      --gold: #f6c75d;
      --light: #e9f2f9;
      --green: #79f2af;
      --text: #11213a;
      --muted: #dfeaf5;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Comic Sans MS", "Segoe Print", cursive, sans-serif;
      background: linear-gradient(180deg, #0d496b, #0e315a 100%);
      color: var(--text);
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 48px 18px 64px;
    }

    h1 {
      margin: 0 0 20px;
      text-align: center;
      font-size: clamp(2.7rem, 5vw, 4.3rem);
      line-height: 1.1;
      letter-spacing: 1px;
      color: #f4f9ff;
      text-shadow: 0 2px 0 rgba(0,0,0,0.08);
      font-weight: 700;
    }

    h1 .line {
      display: inline-block;
      position: relative;
      padding: 0 14px;
    }

    h1 .line::before,
    h1 .line::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 72px;
      height: 4px;
      background: rgba(255,255,255,0.9);
      border-radius: 999px;
    }

    h1 .line::before { left: -84px; }
    h1 .line::after { right: -84px; }

    .subtitle {
      margin: 0 auto 30px;
      max-width: 760px;
      text-align: center;
      font-size: clamp(1.05rem, 2vw, 1.8rem);
      line-height: 1.4;
      color: #f7fbff;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px 28px;
      margin-top: 14px;
    }

    .card {
      background: rgba(11, 32, 58, 0.92);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 12px 30px rgba(5, 20, 36, 0.25);
    }

    .photo {
      height: 260px;
      background-size: cover;
      background-position: center;
      display: block;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px 16px;
      color: #f3f9ff;
      font-size: clamp(1.1rem, 2vw, 1.75rem);
      font-weight: 700;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff4d4d;
      box-shadow: 0 0 0 4px rgba(255, 77, 77, 0.18);
      flex-shrink: 0;
    }

    .label.alt .dot { background: #ff5076; }
    .label.green .dot { background: #44e59f; }
    .label.green { color: #f3fff9; }
    .label.green .place { color: #f0fff7; }

    .other {
      margin-top: 42px;
      text-align: center;
      color: #f6d781;
      font-size: clamp(1.9rem, 3vw, 3rem);
      font-weight: 700;
      line-height: 1.3;
    }

    .locations {
      margin-top: 18px;
      text-align: center;
      color: #f7fbff;
      font-size: clamp(1.1rem, 2vw, 1.8rem);
      line-height: 1.5;
      font-weight: 600;
    }

    .cta {
      margin: 30px auto 0;
      display: block;
      width: min(100%, 420px);
      background: linear-gradient(180deg, #39d77a, #1bb85e);
      border: none;
      border-radius: 16px;
      padding: 18px 20px;
      color: white;
      font-size: clamp(1.2rem, 2vw, 2.2rem);
      font-weight: 800;
      text-align: center;
      box-shadow: 0 12px 26px rgba(28, 154, 84, 0.35);
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .photo { height: 220px; }
      h1 .line::before, h1 .line::after { width: 42px; }
      h1 .line::before { left: -52px; }
      h1 .line::after { right: -52px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1><span class="line">Land for Sale in Abuja</span></h1>
    <p class="subtitle">Secure your future with a piece of land in a location that suits your plans.</p>

    <div class="grid">
      <div class="card">
        <div class="photo" style="background-image: linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0.15)), url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80');"></div>
        <div class="label"><span class="dot"></span><span class="place">Guzape</span></div>
      </div>

      <div class="card">
        <div class="photo" style="background-image: linear-gradient(rgba(0,0,0,0.12), rgba(0,0,0,0.12)), url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80');"></div>
        <div class="label alt"><span class="dot"></span><span class="place">Katampe Extension</span></div>
      </div>

      <div class="card">
        <div class="photo" style="background-image: linear-gradient(rgba(0,0,0,0.12), rgba(0,0,0,0.12)), url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1200&q=80');"></div>
        <div class="label green"><span class="dot"></span><span class="place">Apo Wumba</span></div>
      </div>

      <div class="card">
        <div class="photo" style="background-image: linear-gradient(rgba(0,0,0,0.08), rgba(0,0,0,0.08)), url('https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=1200&q=80');"></div>
        <div class="label alt"><span class="dot"></span><span class="place">Lugbe</span></div>
      </div>

      <div class="card" style="grid-column: 1 / -1; max-width: 610px; margin: 0 auto; width: 100%;">
        <div class="photo" style="background-image: linear-gradient(rgba(0,0,0,0.12), rgba(0,0,0,0.12)), url('https://images.unsplash.com/photo-1494526585095-c41746248156?auto=format&fit=crop&w=1200&q=80');"></div>
        <div class="label"><span class="dot"></span><span class="place">Kubwa</span></div>
      </div>
    </div>

    <div class="other">Other Locations Available</div>
    <div class="locations">Asokoro Ext, Lokogoma, Kurudu, Pyakasa, Jikwoyi, Idu, Kubwa, Dei-Dei, Kuje, Maitama 2 and more.</div>

    <a class="cta" href="https://wa.me/2348135314919?text=Hello%20Realtor%20Kelvinity%2C%20I%20want%20to%20buy%20land%20in%20Abuja.">Chat on WhatsApp →</a>
  </div>
</body>
</html>
